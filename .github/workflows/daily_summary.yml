name: Daily Summary

on:
  schedule:
    # 21:11 UTC: late enough to be "end of day" (well after the last daily_scrape.yml cycle
    # at 16:13 UTC), but with a ~2h45m buffer before midnight UTC so a GH Actions schedule
    # delay can't push this run into the next UTC day (see OPERATIONS.md).
    - cron: "11 21 * * *"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  POETRY_VERSION: "2.3.0"

jobs:
  daily_summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-in-project: true
      - run: cd packages/saddogs-scrape && poetry install
      - name: Send summary email if any rescues still missing
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          cd packages/saddogs-scrape/saddogs_scrape
          echo "Running end-of-day summary at $(date -u '+%Y-%m-%d %H:%M UTC')..."
          poetry run python daily_summary.py