[project]
name = "saddogs-database"
version = "0.1.0"
description = ""
authors = [
    {name = "Jose Caballero",email = "jose.caballero@epicgames.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv (>=1.2.4,<2.0.0)",
    "supabase (>=2.28.0,<3.0.0)"
]

[tool.poetry]
packages = [{include = "saddogs_database"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.10,<0.17.0)"
]

[tool.ruff]
line-length = 120
